name: User journey or feature
description: Describe a task the product should make easier.
body:
  - type: textarea
    id: journey
    attributes:
      label: What do you want to accomplish?
      description: Describe a concrete journey, such as changing several workers together or exploring a cache failure.
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What makes that difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a successful outcome look like?
    validations:
      required: true
